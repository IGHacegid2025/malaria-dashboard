# Netlify build of the website (frontend). The API address is set in Netlify: VITE_API_URL
# Author: Khadim Gueye

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
